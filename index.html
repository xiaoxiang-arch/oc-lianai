function renderResult(result, data){

    let tags = [...main.tags, getDynamicTag(data)];

    <div class="result-section">
        <h2>TA自身的恋爱人格</h2>
        <div class="radar-wrap"><canvas id="personalityRadar"></canvas></div>

            drawRadar("radarChart", data.radar, ["陪伴","共鸣","空间","表达","绑定","依恋"]);
            drawRadar("personalityRadar", Object.values(main.radar), ["占有欲","依恋","主动","防御","付出","信任"]);

function getDynamicTag(data){
    let p = data.percent;
    let max = Object.keys(p).sort((a,b)=>p[b]-p[a])[0];
    let tags = {
        stable:["长情","安心","守候"], soul:["共振","默契","深度"],
        space:["自由","边界","尊重"], emotion:["浪漫","心动","热烈"],
        bond:["偏爱","唯一","珍藏"], attach:["深情","执着","羁绊"]
    };
    let arr = tags[max];
    return arr[p[max] % arr.length];
}

function renderDimensionData(data){
    let names = {stable:"稳定陪伴",soul:"灵魂共鸣",space:"独立空间",emotion:"情感表达",bond:"关系绑定",attach:"深层依恋"};

    return order.map(key => `

            <div class="dim-bar">
                <div class="dim-bar-fill" style="width:${data[key]}%"></div>

    `).join("");
}

function renderPersonality(data){

                <span>${k}</span>
                <span class="dim-val">${data[k]}%</span>
            </div>
            <div class="dim-bar">
                <div class="dim-bar-fill alt" style="width:${data[k]}%"></div>
            </div>
        </div>
    `).join("");
}

<script>
const dimensions = {
    stable:{ name:"稳定陪伴", max:35 },
    soul:{   name:"灵魂共鸣", max:35 },
    space:{  name:"独立空间", max:35 },
    emotion:{name:"情感表达", max:35 },
    bond:{   name:"关系绑定", max:35 },
    attach:{ name:"深层依恋", max:35 }
};

function calculateResult(answers){
    let scores = {stable:0,soul:0,space:0,emotion:0,bond:0,attach:0};
    questions.forEach((q,index)=>{
        let answer = answers[index] === undefined ? 3 : answers[index];
        scores[q.dimension] += answer * q.weight;
    });
    let percentage = {};
    Object.keys(scores).forEach(key=>{
        percentage[key] = Math.round(scores[key] / dimensions[key].max * 100);
        if(percentage[key] > 100) percentage[key] = 100;
        if(percentage[key] < 0)   percentage[key] = 0;
    });
    return {
        raw:scores, percent:percentage,
        radar:[percentage.stable,percentage.soul,percentage.space,percentage.emotion,percentage.bond,percentage.attach]
    };
}

const typeWeights = {
    guardian:{ name:"守护者",   stable:0.6, bond:0.2, attach:0.2 },
    soulmate:{ name:"灵魂共鸣", soul:0.6,   bond:0.2, space:0.2 },
    partner:{  name:"并肩伴侣", space:0.5,  stable:0.3, soul:0.2 },
    healer:{   name:"温柔治愈", stable:0.5, emotion:0.3, attach:0.2 },
    passion:{  name:"炽烈",     emotion:0.5,attach:0.3, bond:0.2 },
    collector:{name:"唯一收藏", bond:0.5,   attach:0.5 },
    guide:{    name:"引路人",   soul:0.4,   space:0.3, stable:0.3 },
    freedom:{  name:"自由共生", space:0.6,  soul:0.3, stable:0.1 },
    rational:{ name:"理性同行", stable:0.5, space:0.3, bond:0.2 },
    poet:{     name:"玫瑰诗人", emotion:0.6,soul:0.2, bond:0.2 },
    listener:{ name:"倾听者",   soul:0.4,   stable:0.4, attach:0.2 },
    fate:{     name:"命定共犯", bond:0.4,   attach:0.4, emotion:0.2 }
};

function getResultType(data){
    let scores = [];
    Object.keys(typeWeights).forEach(type=>{
        let weight = typeWeights[type];
        let total = 0, sum = 0;
        Object.keys(weight).forEach(key=>{
            if(key !== "name"){
                total += data.percent[key] * weight[key];
                sum   += weight[key];
            }
        });
        if(sum > 0) total = total / sum;
        scores.push({ type:type, score:total });
    });
    scores.sort((a,b)=> b.score - a.score);
    return { main: scores[0].type, sub: scores[1].type, ranking: scores, data: data };
}
</script>
<script>
function drawRadar(canvasId, values, labels){
    let canvas = document.getElementById(canvasId);
    if(!canvas) return;
    let rect = canvas.getBoundingClientRect();
    let cssW = rect.width  || 280;
    let cssH = rect.height || cssW;
    if(cssW < 10) cssW = 280;
    if(cssH < 10) cssH = cssW;
    let dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    let ctx = canvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    let width = cssW, height = cssH;
    let centerX = width/2, centerY = height/2;
    let radius = Math.min(width,height) * 0.32;
    let count = values.length;
    let angleStep = Math.PI*2/count;

    ctx.strokeStyle = "rgba(100,120,160,.22)";
    ctx.lineWidth = 1;
    for(let level=1; level<=5; level++){
        ctx.beginPath();
        for(let i=0; i<count; i++){
            let angle = i*angleStep - Math.PI/2;
            let r = radius*level/5;
            let x = centerX + Math.cos(angle)*r;
            let y = centerY + Math.sin(angle)*r;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath(); ctx.stroke();
    }
    for(let i=0; i<count; i++){
        let angle = i*angleStep - Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle)*radius, centerY + Math.sin(angle)*radius);
        ctx.stroke();
    }
    ctx.beginPath();
    values.forEach((value,index)=>{
        let angle = index*angleStep - Math.PI/2;
        let r = radius*value/100;
        let x = centerX + Math.cos(angle)*r;
        let y = centerY + Math.sin(angle)*r;
        if(index===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    let grad = ctx.createLinearGradient(0,0,width,height);
    grad.addColorStop(0,"rgba(145,184,232,.35)");
    grad.addColorStop(1,"rgba(219,166,200,.35)");
    ctx.fillStyle = grad; ctx.fill();
    let strokeGrad = ctx.createLinearGradient(0,0,width,height);
    strokeGrad.addColorStop(0,"#91b8e8");
    strokeGrad.addColorStop(1,"#c96a9f");
    ctx.strokeStyle = strokeGrad; ctx.lineWidth = 2; ctx.stroke();
    values.forEach((value,index)=>{
        let angle = index*angleStep - Math.PI/2;
        let r = radius*value/100;
        let x = centerX + Math.cos(angle)*r;
        let y = centerY + Math.sin(angle)*r;
        ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2);
        ctx.fillStyle = "#ffffff"; ctx.fill();
        ctx.strokeStyle = "#91b8e8"; ctx.lineWidth = 1.5; ctx.stroke();
    });
    ctx.font = "12px sans-serif";
    ctx.fillStyle = "#53607d";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    labels.forEach((label,index)=>{
        let angle = index*angleStep - Math.PI/2;
        let x = centerX + Math.cos(angle)*(radius+22);
        let y = centerY + Math.sin(angle)*(radius+22);
        ctx.fillText(label, x, y);
    });
}
</script>

<script>
let character = { name:"", gender:"" };
let loveGender = "";
let currentPage = 0;
let answers = [];
const questionsPerPage = 3;

function showPage(id){
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo({ top:0, behavior:"instant" });
}
function openProfile(){ showPage("profile-page"); }

function selectCharacterGender(btn, gender){
    btn.parentElement.querySelectorAll(".gender-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    character.gender = gender;
}
function goLoveGender(){
    let name = document.getElementById("character-name").value.trim();
    if(!name){ alert("请输入角色姓名"); return; }
    character.name = name;
    showPage("love-gender-page");
}
function selectLoveGender(btn, gender){
    document.querySelectorAll("#love-gender-page .gender-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    loveGender = gender;
}
function startExplain(){
    if(!loveGender){ alert("请选择恋人性别倾向"); return; }
    showPage("intro-page");
}
function startTest(){ currentPage = 0; answers = []; renderQuestionPage(); showPage("test-page"); }

function renderQuestionPage(){
    let container = document.getElementById("question-container");
    container.innerHTML = "";
    let start = currentPage * questionsPerPage;
    let end   = Math.min(start + questionsPerPage, questions.length);
    let list  = questions.slice(start, end);
    document.getElementById("question-progress").innerText = `${start+1}-${end} / ${questions.length}`;

    let moonData = [
        { emoji:"🌕", score:5, label:"很符合" },
        { emoji:"🌖", score:4, label:"比较符合" },
        { emoji:"🌗", score:3, label:"一般" },
        { emoji:"🌘", score:2, label:"不太符合" },
        { emoji:"🌑", score:1, label:"不符合" }
    ];

    list.forEach((q, index)=>{
        let realIndex = start + index;
        let optionsHTML = moonData.map(m => `
            <div class="moon-item" onclick="chooseAnswer(${realIndex},${m.score},this)">
                <div class="moon">${m.emoji}</div>
                <div class="moon-label">${m.label}</div>
            </div>
        `).join("");
        container.innerHTML += `
        <div class="question-card">
            <div class="question-title">${realIndex+1}. ${q.text}</div>
            <div class="moon-options">${optionsHTML}</div>
        </div>`;
    });

    list.forEach((q, index)=>{
        let realIndex = start + index;
        if(answers[realIndex] !== undefined){
            let card = container.querySelectorAll(".question-card")[index];
            let items = card.querySelectorAll(".moon-item");
            let moonIndex = 5 - answers[realIndex];
            if(items[moonIndex]) items[moonIndex].classList.add("selected");
        }
    });
}

function chooseAnswer(index, score, element){
    element.parentElement.querySelectorAll(".moon-item").forEach(m => m.classList.remove("selected"));
    element.classList.add("selected");
    answers[index] = score;
}

function goBackTest(){
    if(currentPage > 0){
        currentPage--;
        renderQuestionPage();
        window.scrollTo({ top:0, behavior:"instant" });
    }else{
        showPage("intro-page");
    }
}

function nextQuestion(){
    let start = currentPage * questionsPerPage;
    let end   = Math.min(start + questionsPerPage, questions.length);
    for(let i=start; i<end; i++){
        if(answers[i] === undefined){ alert("请完成当前页所有选择"); return; }
    }
    let totalPages = Math.ceil(questions.length / questionsPerPage);
    if(currentPage < totalPages - 1){
        currentPage++;
        renderQuestionPage();
        window.scrollTo({ top:0, behavior:"instant" });
    }else{
        finishTest();
    }
}

function finishTest(){
    showPage("loading-page");
    let texts = ["读取依恋倾向","分析理想关系","寻找灵魂契合","生成恋爱档案"];
    let index = 0;
    let loadingEl = document.getElementById("loading-text");
    loadingEl.innerText = texts[0];
    let timer = setInterval(()=>{
        index++;
        if(index >= texts.length){
            clearInterval(timer);
            setTimeout(()=>generateResult(), 800);
            return;
        }
        loadingEl.innerText = texts[index];
    }, 700);
}

function generateResult(){
    let data = calculateResult(answers);
    let result = getResultType(data);
    renderResult(result, data);
    showPage("result-page");
}
